<style>:root{font-family:system-ui,-apple-system,'Trebuchet MS',Arial,sans-serif;--navy:#102e51;--gold:#ffd978;--white:#fff9e9;color:#fff;-webkit-tap-highlight-color:transparent;color-scheme:light}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #fff3a3;outline-offset:3px}[hidden]{display:none!important}
.app{position:relative;height:100vh;height:100dvh;width:100%;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#0872d6 0%,#0997eb 54%,#8ce7ef 100%);--accent:#9de065}

.sky-mist,.sun-wash,.sea,.cloud,.tiny-isle{position:absolute;pointer-events:none}.sky-mist{inset:0;background:radial-gradient(ellipse at 54% 38%,#d0f2ff44 0%,transparent 60%)}.sun-wash{inset:0;background:linear-gradient(180deg,#1645b822 0%,transparent 63%)}
.sea{bottom:0;width:100%;height:22%;background:linear-gradient(180deg,#8fe0f3aa,#349dcb99 42%,#157dcc);clip-path:polygon(0 7%,25% 11%,49% 8%,78% 12%,100% 8%,100% 100%,0 100%)}.sea:before{content:'';position:absolute;inset:15% 0;background:repeating-linear-gradient(174deg,transparent 0 46px,#e7ffff44 47px 49px,transparent 50px 78px)}
.cloud{background:#d8f5ffad;clip-path:polygon(0 70%,15% 48%,32% 54%,47% 15%,60% 33%,74% 24%,100% 72%,100% 88%,0 88%);filter:drop-shadow(0 7px 0 #5ebbe833)}.cloud-one{left:-7%;top:22%;width:39%;height:9%}.cloud-two{right:-8%;top:31%;width:35%;height:7%;transform:scaleX(-1)}.cloud-three{left:7%;top:64%;width:20%;height:5%;opacity:.65}
.tiny-isle{width:20px;height:12px;clip-path:polygon(0 25%,100% 25%,58% 100%,33% 100%);background:linear-gradient(180deg,#a3da65 0 27%,#6257a8 28%);opacity:.7}.isle-one{left:8%;top:55%}.isle-two{right:8%;top:61%}
.world{position:absolute;inset:0;z-index:1;touch-action:none}.world canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.world canvas:active{cursor:grabbing}

.home-dock{position:absolute;z-index:10;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;align-items:center;justify-content:center;pointer-events:none;min-height:48px}.class-mark{display:flex;align-items:center;gap:10px;background:#112b4f82;color:#fff9eb;border:1px solid #fff7da55;border-radius:26px;padding:9px 13px;font-size:13px;font-weight:850;letter-spacing:1.6px;backdrop-filter:blur(5px);pointer-events:none;box-shadow:0 3px 12px #194d7833}.class-mark span{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:0}.tree-dots{position:absolute;bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;gap:7px;justify-content:center}.tree-dots i{display:block;width:5px;height:5px;border-radius:8px;background:#c2e8e6aa;box-shadow:0 1px 3px #0004;transition:all .2s}.tree-dots i.active{width:18px;background:#ffdf85}.enter-explore{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:0;pointer-events:auto}
.explore-dock{position:absolute;z-index:10;left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:61px;border-radius:27px;max-width:470px;margin:0 auto;padding:5px;display:flex;align-items:center;gap:4px;background:#102b4ed4;border:1px solid #d9f6f999;box-shadow:0 4px 18px #00487942;backdrop-filter:blur(12px)}.dock-arrow{border:0;color:#fcf6df;background:transparent;width:50px;height:47px;flex:0 0 50px;display:grid;place-items:center;border-radius:22px}.group-selector{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:center;padding:4px;border:0;background:transparent;color:#fff8e6}.group-selector strong{font-size:14px;line-height:1.13;font-weight:850;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.group-selector span{font-size:9px;letter-spacing:1.4px;color:#f9d991;font-weight:850}
.group-list:not([hidden]){position:absolute;bottom:calc(100% + 9px);left:0;right:0;max-height:min(48vh,360px);overflow:auto;display:flex;flex-wrap:wrap;gap:7px;padding:11px;border:1px solid #ffffff99;border-radius:19px;background:#0f315ae8;box-shadow:0 8px 26px #0b41625e}.group-chip{border:1px solid #aacdd78a;border-radius:12px;background:#17456d;color:#effaff;padding:9px 11px;font-size:12px;font-weight:750;max-width:100%;text-align:left}.group-chip.selected{color:#183e59;background:#ffd877}

function renderSoftware(w,h,eye){const c=softContext,source=softMeshes[active],forward=norm(sub(renderTarget,eye)),renderList=[];

  let t=source[i],p=transform(viewProj,t.a),q=transform(viewProj,t.b),r=transform(viewProj,t.c);
  if(p[2]>1.2&&q[2]>1.2&&r[2]>1.2)continue;
  const x0=(p[0]+1)*w/2,y0=(1-p[1])*h/2,x1=(q[0]+1)*w/2,y1=(1-q[1])*h/2,x2=(r[0]+1)*w/2,y2=(1-r[1])*h/2;
  if(Math.max(x0,x1,x2)<-20||Math.min(x0,x1,x2)>w+20||Math.max(y0,y1,y2)<-20||Math.min(y0,y1,y2)>h+20)continue;

function attrib(buf,loc,size){gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0)}
function render(){if(!webglOK&&!softwareOK)return;if(document.hidden){requestAnimationFrame(render);return;}let canvas=$('#canvas'),r=canvas.getBoundingClientRect();if(!r.width||!r.height){requestAnimationFrame(render);return}let pixelRatio=Math.min(window.devicePixelRatio||1,webglOK?1.85:1.25);let w=Math.ceil(r.width*pixelRatio),h=Math.ceil(r.height*pixelRatio);
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;if(webglOK)gl.viewport(0,0,w,h);previousCameraKey=''}
 const aspect=w/h,eye=[renderTarget[0]+distance*Math.sin(angle)*Math.cos(elevation),renderTarget[1]+distance*Math.sin(elevation),renderTarget[2]+distance*Math.cos(angle)*Math.cos(elevation)];viewCam=eye;

 requestAnimationFrame(render)}

function screenPoint(p){const a=transform(viewProj,p),r=$('#canvas').getBoundingClientRect();return{x:r.left+(a[0]+1)*r.width*.5,y:r.top+(1-a[1])*r.height*.5,z:a[2]}}
function homeDistance(){let aspect=Math.max(.36,$('#canvas').clientWidth/Math.max(1,$('#canvas').clientHeight));return clamp(4.85/(Math.tan(20*PI/180)*aspect),24.4,33.0)}
function exploreDistance(){return homeDistance()*.85}
function renderDots(){const which=kinds.indexOf(active);$$('#treeDots i').forEach((d,i)=>d.classList.toggle('active',i===which))}
function changeTree(which){active=which;let i=kinds.indexOf(which),d=lore[which],app=$('#app');app.className='app '+which.toLowerCase();$$('.chapter').forEach(ch=>{let sel=ch.dataset.tree===which;ch.classList.toggle('active',sel);ch.setAttribute('aria-selected',String(sel))});$('#treeTitle').textContent=which.toUpperCase();$('#treeSubtitle').textContent=d.sub;$('#treeBlurb').textContent=d.description;$('#treeCount').textContent=d.total;$('.world-caption').innerHTML=d.tag.replace(' · ',' <span class="sparkle">✦</span> ');$('#treeNumber').innerHTML=d.number+' <span>/ 03</span>';$('#exploreCount').textContent=d.total+' FRUITS';$('#exploreHeading').textContent=which+' branches';angle=.16;elevation=.18;distance=mode==='explore'?exploreDistance():homeDistance();renderDots();selectedGroup=0;groupPage=0;if(mode==='explore')paintGroups();else refreshFruits(which)}
function groupsFor(kind){let list=records.filter(v=>v.class===kind),keys=[...new Set(list.map(v=>v.group))];return keys.map(name=>({name,fruits:list.filter(v=>v.group===name)}))}
const curated={Zoan:[10,21,24,19],Logia:[44,45,47,55],Paramecia:[57,69,56,80]};
function refreshFruits(kind){let sc=scenes[kind];if(!sc)return;
 const ids=(kind===active&&mode==='explore'&&selectable.length?selectable.map(f=>f.id):curated[kind]);
 let mesh=new Mesh();const base=sc.base;
 mesh.pos=base.pos.slice();mesh.nrm=base.nrm.slice();mesh.col=base.col.slice();mesh.glw=base.glw.slice();
 sc.fruits=[];
 for(let i=0;i<Math.min(sc.slots.length,ids.length);i++){
  let slot=sc.slots[i],id=ids[i];let color=slot.color;
  // Each preview uses the colour identity of its branch, with distinct sculpted swirls.
  hang(mesh,slot.at,slot.anchor,color,id*1.71+1);sc.fruits.push({...slot,fruitId:id});
 }

}
function groupShort(n){if(n.length>27)return n.slice(0,25)+'…';return n}
function paintGroups(){allGroups=groupsFor(active);selectedGroup=clamp(selectedGroup,0,allGroups.length-1);let grp=allGroups[selectedGroup],per=3,totalPages=Math.ceil(grp.fruits.length/per);groupPage=clamp(groupPage,0,totalPages-1);let gp=$('#groupList');gp.innerHTML='';allGroups.forEach((g,i)=>{let b=document.createElement('button');b.className='group-chip'+(i===selectedGroup?' selected':'');b.textContent=groupShort(g.name);b.setAttribute('role','tab');b.setAttribute('aria-selected',String(i===selectedGroup));b.onclick=()=>{selectedGroup=i;groupPage=0;paintGroups();$('#groupList').hidden=true};gp.append(b)});$('#groupHeading').textContent=grp.name;$('#groupPage').textContent=String(groupPage+1).padStart(2,'0')+' / '+String(totalPages).padStart(2,'0');let strip=$('#fruitStrip');strip.innerHTML='';selectable=grp.fruits.slice(groupPage*per,groupPage*per+per);selectable.forEach((f,i)=>{let b=document.createElement('button');b.className='fruit-tile';let glyph=document.createElement('span');glyph.className='fruit-glyph';glyph.textContent=['✺','✿','✦','❂'][i%4];glyph.style.background=['linear-gradient(135deg,#9153cf,#473b9a)','linear-gradient(135deg,#fcb668,#b65e2a)','linear-gradient(135deg,#56d4c4,#1c83b6)','linear-gradient(135deg,#ed9dbb,#a950ac)'][i%4];let label=document.createElement('span');label.textContent=f.name.replace(' no Mi','').slice(0,28);b.append(glyph,label);b.title=f.name;b.onclick=()=>openDetails(f.id);strip.append(b)});$('#prevPage').disabled=groupPage===0;$('#nextPage').disabled=groupPage>=totalPages-1;refreshFruits(active)}
function showMode(next){
 mode=next;$('#app').dataset.mode=mode;
 $('#homeHud').hidden=mode!=='home';$('#explorePanel').hidden=mode!=='explore';$('#backToWorld').hidden=mode!=='explore';
 $('#groupList').hidden=true;
 if(mode==='explore'){paintGroups();distance=exploreDistance();elevation=.18}
 else{distance=homeDistance();elevation=.18;refreshFruits(active)}
}
function shiftFamily(step){if(mode!=='explore')return;let g=allGroups[selectedGroup],pages=Math.ceil(g.fruits.length/3);

 groupPage=step<0?Math.ceil(allGroups[selectedGroup].fruits.length/3)-1:0;
 paintGroups();$('#groupList').hidden=true;
}
const safe=v=>String(v==null||v===''?'Not recorded':v);
function openDetails(id){let f=records.find(x=>x.id===id);if(!f)return;selectedId=f.id;$('#detailEyebrow').textContent=`${f.class.toUpperCase()} · ${f.group} · FRUIT ${String(f.id+1).padStart(3,'0')} / 146`;$('#detailTitle').textContent=f.name;$('#detailPower').textContent=f.power;const fieldNames=[['TYPE','subtype'],['USER','users'],['AFFILIATION','affiliation'],['STORY ARCS','arcs'],['SAGA','saga'],['AWAKENED','awakened'],['ORIGIN','origin']];let dl=$('#detailFields');dl.innerHTML='';for(const [k,field] of fieldNames){let dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=safe(f[field]);dl.append(dt,dd)}$('#detailOverlay').hidden=false}
function nextDetail(step){let idx=records.findIndex(x=>x.id===selectedId),same=records.filter(v=>v.class===active),current=same.findIndex(v=>v.id===selectedId),next=same[(current+step+same.length)%same.length];openDetails(next.id)}
function openCatalogue(){$('#catalogueOverlay').hidden=false;$('#searchFruit').value='';filterCatalogue('');setTimeout(()=>$('#searchFruit').focus(),10)}
function filterCatalogue(s){let term=s.trim().toLowerCase(),list=records.filter(f=>f.class===active&&(f.name+' '+f.power+' '+f.users+' '+f.group).toLowerCase().includes(term));let target=$('#catalogueResults');target.innerHTML='';for(const f of list){let row=document.createElement('button');row.className='catalogue-entry';let c=document.createElement('div');c.innerHTML='<strong></strong><span></span>';c.querySelector('strong').textContent=f.name;c.querySelector('span').textContent=f.power;let no=document.createElement('b');no.textContent='#'+String(f.id+1).padStart(3,'0');row.append(c,no);row.onclick=()=>{$('#catalogueOverlay').hidden=true;openDetails(f.id)};target.append(row)}if(!list.length){let p=document.createElement('p');p.textContent='No fruit matches that search.';target.append(p)}}
function bindInput(){
 const open=$('#openCatalogue'),close=$('#closeCatalogue'),exit=$('#backToWorld'),c=$('#canvas');
 $('#prevTree').onclick=()=>changeTree(kinds[(kinds.indexOf(active)+2)%3]);

  if(!pointers.has(e.pointerId))return;

  one=null;
  let dx=e.clientX-st.x,dy=e.clientY-st.y;
  if(mode==='home'&&st.type==='touch'&&Math.abs(dx)>64&&Math.abs(dx)>Math.abs(dy)*1.25){

  }

  if(e.key==='ArrowLeft'){if(!$('#detailOverlay').hidden)nextDetail(-1);else if(mode==='explore')shiftFamily(-1);else changeTree(kinds[(kinds.indexOf(active)+2)%3])}
  if(e.key==='ArrowRight'){if(!$('#detailOverlay').hidden)nextDetail(1);else if(mode==='explore')shiftFamily(1);else changeTree(kinds[(kinds.indexOf(active)+1)%3])}

}
function auditScene(){const out={count:records.length,groups:groupsFor('Zoan').length+groupsFor('Logia').length+groupsFor('Paramecia').length,classes:{},meshes:{},hasWebGL:webglOK,has3D:softwareOK||webglOK,renderer:webglOK?"WebGL":"Software 3D"};for(const kind of kinds){const m=scenes[kind].mesh;let b=[Infinity,Infinity,Infinity,-Infinity,-Infinity,-Infinity];for(let i=0;i<m.pos.length;i+=3){for(let k=0;k<3;k++){b[k]=Math.min(b[k],m.pos[i+k]);b[k+3]=Math.max(b[k+3],m.pos[i+k])}}out.meshes[kind]={triangles:m.pos.length/9,bounds:b,extents:[b[3]-b[0],b[4]-b[1],b[5]-b[2]],vertices:m.pos.length/3,fruits:scenes[kind].fruits.length};out.classes[kind]=records.filter(v=>v.class===kind).length;}return out}

})();
