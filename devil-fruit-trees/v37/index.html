<style>:root{font-family:system-ui,-apple-system,'Trebuchet MS',Arial,sans-serif;--navy:#102e51;--gold:#ffd978;--white:#fff9e9;color:#fff;-webkit-tap-highlight-color:transparent;color-scheme:light}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #fff3a3;outline-offset:3px}[hidden]{display:none!important}
.app{position:relative;height:100vh;height:100dvh;width:100%;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#0872d6 0%,#0997eb 54%,#8ce7ef 100%);--accent:#9de065}

.sky-mist,.sun-wash,.sea,.cloud,.tiny-isle{position:absolute;pointer-events:none}.sky-mist{inset:0;background:radial-gradient(ellipse at 54% 38%,#d0f2ff44 0%,transparent 60%)}.sun-wash{inset:0;background:linear-gradient(180deg,#1645b822 0%,transparent 63%)}
.sea{bottom:0;width:100%;height:22%;background:linear-gradient(180deg,#8fe0f3aa,#349dcb99 42%,#157dcc);clip-path:polygon(0 7%,25% 11%,49% 8%,78% 12%,100% 8%,100% 100%,0 100%)}.sea:before{content:'';position:absolute;inset:15% 0;background:repeating-linear-gradient(174deg,transparent 0 46px,#e7ffff44 47px 49px,transparent 50px 78px)}
.cloud{background:#d8f5ffad;clip-path:polygon(0 70%,15% 48%,32% 54%,47% 15%,60% 33%,74% 24%,100% 72%,100% 88%,0 88%);filter:drop-shadow(0 7px 0 #5ebbe833)}.cloud-one{left:-7%;top:22%;width:39%;height:9%}.cloud-two{right:-8%;top:31%;width:35%;height:7%;transform:scaleX(-1)}.cloud-three{left:7%;top:64%;width:20%;height:5%;opacity:.65}

.world{position:absolute;inset:0;z-index:1;touch-action:none}.world canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.world canvas:active{cursor:grabbing}
.floating-control{position:absolute;z-index:10;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fefae9;background:#112c50a8;border:1.5px solid #ffffff77;box-shadow:0 4px 13px #00416b2d;backdrop-filter:blur(8px);padding:0;transition:transform .16s;border-color:#f0f8f6a9}.floating-control:active,.dock-arrow:active{transform:scale(.92)}.catalogue-trigger{top:calc(14px + env(safe-area-inset-top,0px));right:calc(15px + env(safe-area-inset-right,0px))}.exit-explore{left:calc(15px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px))}
.home-dock{position:absolute;z-index:10;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;align-items:center;justify-content:center;pointer-events:none;min-height:48px}.class-mark{display:flex;align-items:center;gap:10px;background:#112b4f82;color:#fff9eb;border:1px solid #fff7da55;border-radius:26px;padding:9px 13px;font-size:13px;font-weight:850;letter-spacing:1.6px;backdrop-filter:blur(5px);pointer-events:none;box-shadow:0 3px 12px #194d7833}.class-mark span{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:0}.tree-dots{position:absolute;bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;gap:7px;justify-content:center}.tree-dots i{display:block;width:5px;height:5px;border-radius:8px;background:#c2e8e6aa;box-shadow:0 1px 3px #0004;transition:all .2s}.tree-dots i.active{width:18px;background:#ffdf85}.enter-explore{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:0;pointer-events:auto}
.explore-dock{position:absolute;z-index:10;left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:61px;border-radius:27px;max-width:470px;margin:0 auto;padding:5px;display:flex;align-items:center;gap:4px;background:#102b4ed4;border:1px solid #d9f6f999;box-shadow:0 4px 18px #00487942;backdrop-filter:blur(12px)}.dock-arrow{border:0;color:#fcf6df;background:transparent;width:50px;height:47px;flex:0 0 50px;display:grid;place-items:center;border-radius:22px}.group-selector{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:center;padding:4px;border:0;background:transparent;color:#fff8e6}.group-selector strong{font-size:14px;line-height:1.13;font-weight:850;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.group-selector span{font-size:9px;letter-spacing:1.4px;color:#f9d991;font-weight:850}
.group-list:not([hidden]){position:absolute;bottom:calc(100% + 9px);left:0;right:0;max-height:56px;overflow:auto;display:flex;flex-wrap:wrap;gap:7px;padding:11px;border:1px solid #ffffff99;border-radius:19px;background:#0f315ae8;box-shadow:0 8px 26px #0b41625e}.group-chip{border:1px solid #aacdd78a;border-radius:12px;background:#17456d;color:#effaff;padding:9px 11px;font-size:12px;font-weight:750;max-width:100%;text-align:left}.group-chip.selected{color:#183e59;background:#ffd877}
.detail-overlay,.catalogue-overlay{position:absolute;z-index:30;inset:0;background:#072c52a0;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px);touch-action:pan-y}.detail-sheet,.catalogue-sheet{position:relative;width:100%;max-width:570px;max-height:75dvh;overflow:auto;overscroll-behavior:contain;background:#fff9eb;color:#183c57;border-radius:27px 27px 0 0;padding:24px 20px calc(19px + env(safe-area-inset-bottom,0px));border-top:2px solid #ffde97;box-shadow:0 -9px 32px #062d56a3}.close-detail,.catalogue-close{position:absolute;top:13px;right:14px;width:42px;height:42px;border:0;border-radius:50%;font-size:30px;line-height:1;background:#204766;color:white}.detail-eyebrow{padding-right:50px;font-size:10px;letter-spacing:1.25px;font-weight:800;color:#996c45}.detail-sheet h2{font-size:clamp(24px,7vw,34px);margin:12px 44px 8px 0;line-height:1.13;overflow-wrap:anywhere}.detail-power{background:#e6f3ec;border-radius:15px;padding:12px 13px;font-size:14px;font-weight:720;line-height:1.5}.detail-fields{display:grid;grid-template-columns:minmax(98px,31%) 1fr;column-gap:9px;row-gap:12px;margin:15px 0 15px}.detail-fields dt{font-size:10px;font-weight:900;letter-spacing:.9px;color:#b0783e}.detail-fields dd{margin:0;font-size:13px;font-weight:625;line-height:1.4;overflow-wrap:anywhere}.detail-foot{display:flex;gap:9px;justify-content:space-between}.detail-foot button{width:52px;height:40px;background:#234e71;border:0;border-radius:12px;font-size:29px;line-height:1;color:#fff9e4}
.catalogue-sheet{height:85dvh;max-height:85dvh}.catalogue-head{display:flex;justify-content:space-between;align-items:center;min-height:30px;margin-bottom:16px}.catalogue-head strong{font-size:25px;line-height:1}.catalogue-close{position:static;flex-shrink:0}.catalogue-sheet input{width:100%;height:49px;border-radius:14px;background:#fff;border:1.5px solid #b2c9ca;padding:12px 15px;font-size:16px;outline-color:#5b99c3}.catalogue-results{display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:calc(85dvh - 155px);padding-top:10px}.catalogue-entry{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid #d1e1da;background:#eef7f0;border-radius:13px;color:#224965;padding:11px 12px}.catalogue-entry strong{font-size:13px;display:block}.catalogue-entry span{font-size:11px;color:#66808c;line-height:1.3}.catalogue-entry b{font-size:11px;color:#b7874b;margin-left:auto}.loading{position:absolute;z-index:99;inset:0;background:#0c6bd3;display:grid;place-items:center;pointer-events:none;transition:opacity .3s}.spinner{width:38px;height:38px;border-radius:50%;border:4px solid #ffffff55;border-top-color:#fff4c9;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* V30: absolutely no permanent visible words, instruction panels or obstructive family picker. */
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;margin:-1px!important;padding:0!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

.dock-arrow{width:45px;flex:0 0 45px;height:44px;color:#fffff4}

.group-list:not([hidden]){left:50%;right:auto;transform:translateX(-50%);width:min(92vw,520px);bottom:calc(100% + 8px);display:flex;flex-wrap:nowrap;white-space:nowrap;align-items:center;gap:5px;padding:6px;overflow-x:auto;overflow-y:hidden;max-height:56px;height:56px;border-radius:15px;background:#0e3457c7;border:1px solid #fff6d155;box-shadow:0 6px 20px #124e7960;scrollbar-width:none}
.group-list:not([hidden])::-webkit-scrollbar{display:none}.group-chip{white-space:nowrap;flex-shrink:0;padding:9px 12px;font-size:12px;border-radius:10px}
.detail-overlay,.catalogue-overlay{background:#072c52ab}.detail-sheet,.catalogue-sheet{border-radius:22px 22px 0 0}

.cloud{opacity:.65}.tiny-isle{opacity:.3}.sky-mist{opacity:.6}

    </div>
