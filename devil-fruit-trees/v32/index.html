 window.__LEGENDARY_V32__={audit:auditScene,select:changeTree,explore:()=>showMode('explore'),openFruit:openDetails,groupsFor,allRecords:records,screenPoint,pickCentres:()=>scenes[active].fruits.map(f=>screenPoint(f.at)),get state(){return{active,mode,groupPage,selectedGroup,selectedId,angle,elevation,distance}}};}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
