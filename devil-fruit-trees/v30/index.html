<style>:root{font-family:system-ui,-apple-system,'Trebuchet MS',Arial,sans-serif;--navy:#102e51;--gold:#ffd978;--white:#fff9e9;color:#fff;-webkit-tap-highlight-color:transparent;color-scheme:light}

.group-list:not([hidden]){position:absolute;bottom:calc(100% + 9px);left:0;right:0;max-height:min(48vh,360px);overflow:auto;display:flex;flex-wrap:wrap;gap:7px;padding:11px;border:1px solid #ffffff99;border-radius:19px;background:#0f315ae8;box-shadow:0 8px 26px #0b41625e}.group-chip{border:1px solid #aacdd78a;border-radius:12px;background:#17456d;color:#effaff;padding:9px 11px;font-size:12px;font-weight:750;max-width:100%;text-align:left}.group-chip.selected{color:#183e59;background:#ffd877}

function init(){bindInput();changeTree(active);scenes={Zoan:zoanScene(),Logia:logiaScene(),Paramecia:parameciaScene()};for(const kind of kinds)refreshFruits(kind);try{try{setupWebGL()}catch(e){console.warn('WebGL not available; using original software 3D fallback',e.message);setupSoftware()}if(webglOK)for(const kind of kinds)gpu[kind]=sendMesh(scenes[kind].mesh);render();$('#loading').style.opacity='0';setTimeout(()=>$('#loading').hidden=true,320)}catch(e){console.error('Rendering error',e);$('#loading').textContent='3D GRAPHICS UNAVAILABLE';}
 window.__LEGENDARY_V30__={audit:auditScene,select:changeTree,explore:()=>showMode('explore'),openFruit:openDetails,groupsFor,allRecords:records,screenPoint,pickCentres:()=>scenes[active].fruits.map(f=>screenPoint(f.at)),get state(){return{active,mode,groupPage,selectedGroup,selectedId,angle,elevation,distance}}};}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
