 }else if(ci===1){

 }else{

  for(let j=0;j<5;j++){const a0=j*TAU/5,pts=Array.from({length:29},(_,i)=>{const t=i/28,a=a0+t*TAU*1.23;const r=2.3+Math.sin(t*P)*1.15;return v(Math.cos(a)*r,.4+t*34,Math.sin(a)*r);});

  for(let j=0;j<3;j++){const a0=j*TAU/3,pts=Array.from({length:69},(_,i)=>{const t=i/68,a=a0+t*TAU*1.20;return v(Math.cos(a)*(13+Math.sin(t*P)*2),29.6+Math.sin(t*P)*9.2,Math.sin(a)*(9+Math.sin(t*P)*2));});

  for(let k=0;k<7;k++){const a=k*TAU/7;const st=v(Math.cos(a)*3.0,8.2,Math.sin(a)*3);const tip=v(Math.cos(a)*15.0,2.1,Math.sin(a)*13);

function onUp(e){touches.delete(e.pointerId);lastPinch=0;if(pointer!==e.pointerId)return;pointer=null;if(dragged&&app.stage===0&&W/H<.72&&Math.abs(e.clientX-downX)>65){shiftRealm(e.clientX<downX?1:-1);return;}if(!dragged){const h=hit(e.clientX,e.clientY);if(h)h.fn();else if(app.stage===0){let best=null,bestD=1e10;for(let ci=0;ci<3;ci++){const p=pr(add(treePositions[ci],v(0,8,0)));if(!p)continue;const dd=Math.hypot(p.x-e.clientX,p.y-e.clientY);if(dd<bestD){best=ci;bestD=dd;}}if(best!==null&&bestD<Math.min(W,H)*.28)selectClass(best);}}
}
for(const el of [canvas,gpu]){el.addEventListener('pointermove',onMove);el.addEventListener('pointerup',onUp);el.addEventListener('pointercancel',e=>{pointer=null;touches.delete(e.pointerId);lastPinch=0});el.addEventListener('wheel',e=>{e.preventDefault();camera.goalDist=clamp(camera.goalDist*Math.exp(e.deltaY*.0011),app.stage===3?7:app.stage===2?9:10,app.stage===0?160:62)},{passive:false});}
